version: '3.8'

services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: raomysql-backend
    environment:
      - SECRET_KEY=${SECRET_KEY:-raomysql-change-this-in-production-2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-raomysql-32-byte-encryption-key-2026!!}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    expose:
      - "8000"
    networks:
      - raomysql-net

  # ── Frontend (Landing Page + React SPA + Nginx) ──
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: raomysql-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    restart: unless-stopped
    networks:
      - raomysql-net

  # ── Certbot (HTTPS auto-renew) ──
  certbot:
    image: certbot/certbot
    container_name: raomysql-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - raomysql-net

volumes:
  backend_data:
  certbot-etc:
  certbot-var:
  webroot:

networks:
  raomysql-net:
    driver: bridge
